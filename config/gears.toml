# The Gears settings that ship with Gears. Gears asks for everything else.
version = 1
default_provider = "openrouter"

# Gears offers these providers and models when no model is chosen yet, and in
# /setup; any other model id can be typed there. Interactive saves keys in
# the Gears directory. None keeps them in memory. A provider without
# api_key_file gets no key.
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_file = "openrouter.key"
models = ["~deepseek/deepseek-flash-latest",
          "~deepseek/deepseek-pro-latest",
          "qwen/qwen4-max",
          "openai/gpt-6.1-sol",
          "google/gemini-4-carbon",
          "google/gemini-4-hydrogen",
          "openai/gpt-6-astra"]

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_file = "openai.key"
models = ["gpt-6.1-sol", "gpt-6-astra"]

[providers.local]
base_url = "http://127.0.0.1:8080/v1"
models = ["local"]

[net]
egress_allowlist = ["openrouter.ai", "api.openai.com", "127.0.0.1"]
plain_http_allowlist = ["127.0.0.1"]

